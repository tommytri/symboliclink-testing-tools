name: Build symboliclink-testing-tools

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [Win32]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore symboliclink-testing-tools.sln

      - name: Build solution
        run: |
          msbuild symboliclink-testing-tools.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=${{ matrix.platform }} `
            /m

      - name: Debug - Find all exe files
        run: |
          Write-Host "Searching for all .exe files..."
          Get-ChildItem -Path . -Include "*.exe" -Recurse | ForEach-Object { Write-Host $_.FullName }
          Write-Host "Listing bin directory structure..."
          Get-ChildItem -Path "**/bin" -Recurse -ErrorAction SilentlyContinue | Select-Object -Property FullName

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: symboliclink-testing-tools
          path: |
            Release/*.exe
          if-no-files-found: warn
